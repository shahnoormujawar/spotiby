services:
  - type: web
    name: spotiby
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_DB
        value: spotiby
      - key: MONGODB_URI
        sync: false
      - key: YTDLP_COOKIES
        sync: false
      # direct = stream YouTube's Opus audio as-is (fast, no ffmpeg). mp3 = transcode (slow on free tier).
      - key: AUDIO_FORMAT
        value: direct
      - key: MAX_DOWNLOADS
        value: "2"
