services:
  - type: web
    name: spotiby
    runtime: node
    plan: free
    region: singapore
    # Deno is required by yt-dlp to solve YouTube's stream challenge. Installed at build time into bin/.
    buildCommand: npm ci && mkdir -p bin && curl -fsSL https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip -o /tmp/deno.zip && unzip -o /tmp/deno.zip -d bin && chmod +x bin/deno
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_DB
        value: spotiby
      - key: MONGODB_URI
        sync: false
