services:
  - type: web
    name: spotiby
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_DB
        value: spotiby
      - key: MONGODB_URI
        sync: false
      - key: YTDLP_COOKIES
        sync: false
      # One download at a time keeps the free 512 MB instance from being OOM-killed
      - key: MAX_DOWNLOADS
        value: "1"
